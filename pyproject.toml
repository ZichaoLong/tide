[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tidegraph"
version = "0.1.0"
description = "Tide CPU graph execution and equivalence foundation"
requires-python = ">=3.10"
dependencies = ["torch>=2.4"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python", "build"]
testpaths = ["tests"]
