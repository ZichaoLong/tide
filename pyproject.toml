[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tidegraph"
version = "0.2.0"
description = "Tide graph execution and configuration equivalence library"
requires-python = ">=3.10"
dependencies = ["torch>=2.4"]

[project.scripts]
tidegraph = "tidegraph.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
