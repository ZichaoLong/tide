[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tide-research"
version = "0.1.0"
description = "Reference experiments for the TIDE architecture"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tide = "tide.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
