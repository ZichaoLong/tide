[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tide-settlegraph"
version = "0.1.0"
description = "Reference runtime and semantics for TIDE SettleGraph"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
tide-runtime = "tide.runtime:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
